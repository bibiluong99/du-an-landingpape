<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="100%" height="100%">
  <defs>
    <filter id="pinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Map Background (Light road grid & green park) -->
  <rect width="240" height="140" fill="#f1f5f9" rx="12"/>
  
  <!-- Parks / River -->
  <path d="M 0 0 C 40 20 60 50 80 140 L 0 140 Z" fill="#e2f5ea" opacity="0.8"/>
  <path d="M 170 0 C 190 40 200 80 240 110 L 240 0 Z" fill="#dbeafe" opacity="0.6"/>

  <!-- Streets & Roads -->
  <path d="M 0 50 L 240 60" stroke="#ffffff" stroke-width="8"/>
  <path d="M 0 50 L 240 60" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <path d="M 120 0 L 130 140" stroke="#ffffff" stroke-width="10"/>
  <path d="M 120 0 L 130 140" stroke="#cbd5e1" stroke-width="1.5"/>

  <path d="M 30 140 L 210 0" stroke="#ffffff" stroke-width="6"/>
  <path d="M 30 140 L 210 0" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Red Location Pin with Label 'Điện Việt' -->
  <g filter="url(#pinShadow)" transform="translate(100, 35)">
    <!-- Red Pin -->
    <path d="M 20 0 C 10 0 2 8 2 18 C 2 30 20 48 20 48 C 20 48 38 30 38 18 C 38 8 30 0 20 0 Z" fill="#dc2626"/>
    <circle cx="20" cy="16" r="6" fill="#ffffff"/>

    <!-- Label Tag -->
    <rect x="42" y="5" width="75" height="24" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="80" y="21" fill="#0f172a" font-family="'Inter', Arial, sans-serif" font-size="11" font-weight="900" text-anchor="middle">Điện Việt</text>
  </g>
</svg>
