<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110" width="100%" height="100%">
  <defs>
    <filter id="truckShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="truckRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <g filter="url(#truckShadow)">
    <!-- Speed motion lines behind truck -->
    <line x1="5" y1="35" x2="25" y2="35" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="50" x2="30" y2="50" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="65" x2="28" y2="65" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>

    <!-- Cargo Box Container -->
    <rect x="35" y="15" width="75" height="60" rx="6" fill="url(#truckRed)"/>
    <!-- Fast lines on container -->
    <line x1="50" y1="45" x2="95" y2="45" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Truck Cab -->
    <path d="M 110 35 L 132 35 C 137 35 142 42 145 48 L 148 60 C 150 64 150 75 145 75 L 110 75 Z" fill="url(#truckRed)"/>
    <!-- Cab Window -->
    <path d="M 115 40 L 130 40 C 134 40 137 44 139 50 L 140 54 L 115 54 Z" fill="#ffffff" opacity="0.9"/>
    
    <!-- Front Bumper & Headlight -->
    <rect x="145" y="65" width="5" height="7" rx="2" fill="#fbbf24"/>

    <!-- Chassis bottom bar -->
    <rect x="38" y="72" width="105" height="8" rx="3" fill="#1e293b"/>

    <!-- Wheels -->
    <circle cx="58" cy="80" r="14" fill="#0f172a"/>
    <circle cx="58" cy="80" r="6" fill="#cbd5e1"/>
    
    <circle cx="126" cy="80" r="14" fill="#0f172a"/>
    <circle cx="126" cy="80" r="6" fill="#cbd5e1"/>
  </g>
</svg>
