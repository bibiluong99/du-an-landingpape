<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="shieldShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#7f1d1d" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="shieldRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="10%" stop-color="#f87171"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>

  <g filter="url(#shieldShadow)" transform="translate(10, 5)">
    <!-- Outer Golden/White border -->
    <path d="M 50 5 L 88 18 C 88 60 70 85 50 100 C 30 85 12 60 12 18 Z" fill="#ffffff" opacity="0.3"/>
    <!-- Main Red Shield -->
    <path d="M 50 8 L 84 20 C 84 58 68 81 50 95 C 32 81 16 58 16 20 Z" fill="url(#shieldRed)"/>
    <!-- Inner Gloss Accent -->
    <path d="M 50 14 L 78 24 C 78 54 64 74 50 86 C 36 74 22 54 22 24 Z" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>
    <!-- Big Bold Checkmark -->
    <path d="M 34 50 L 46 62 L 68 38" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
