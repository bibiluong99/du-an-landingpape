<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập Quản Trị - ĐIỆN VIỆT CMS</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fef2f2',
              100: '#fee2e2',
              500: '#ef4444',
              600: '#dc2626',
              700: '#b91c1c',
              800: '#991b1b',
              900: '#7f1d1d'
            }
          }
        }
      }
    }
  </script>
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gradient-to-br from-red-50 via-white to-red-50/50 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    
    <!-- Top Branded Header -->
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center space-x-3 group mb-3">
        <div class="w-12 h-12 rounded-2xl bg-brand-600 text-white flex items-center justify-center font-black text-2xl shadow-lg shadow-red-200 group-hover:scale-105 transition">
          <i class="fa-solid fa-bolt"></i>
        </div>
        <div class="text-left">
          <span class="text-2xl font-black tracking-tight text-slate-900">Điện <span class="text-brand-600">Việt</span></span>
          <span class="block text-[10px] tracking-widest font-bold uppercase text-slate-400 -mt-1">Hệ Thống Quản Trị CMS</span>
        </div>
      </a>
      <h2 class="text-xl font-black text-slate-900">Đăng Nhập Quản Trị Viên</h2>
      <p class="text-xs text-slate-500 mt-1">Truy cập để quản lý sản phẩm, danh mục, tin tức & liên hệ</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white p-8 rounded-3xl border border-red-100 shadow-xl shadow-red-100/50">
      
      <!-- Error / Alert Message -->
      <div id="login-alert" class="hidden mb-5 p-3.5 rounded-xl text-xs font-semibold flex items-center space-x-2">
        <i class="fa-solid fa-triangle-exclamation text-sm shrink-0"></i>
        <span id="login-alert-text"></span>
      </div>

      <form id="login-form" class="space-y-5">
        <!-- Tên đăng nhập (Username) -->
        <div>
          <label for="username" class="block text-xs font-bold uppercase text-slate-700 mb-1.5">
            Tên đăng nhập (Username)
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="fa-solid fa-user-shield text-sm"></i>
            </div>
            <input type="text" id="username" name="username" required 
                   placeholder="Nhập tên đăng nhập quản trị..." 
                   class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:border-brand-600 focus:ring-2 focus:ring-red-100 text-sm outline-none transition">
          </div>
        </div>

        <!-- Mật khẩu (Password) -->
        <div>
          <label for="password" class="block text-xs font-bold uppercase text-slate-700 mb-1.5">
            Mật khẩu (Password)
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="fa-solid fa-lock text-sm"></i>
            </div>
            <input type="password" id="password" name="password" required 
                   placeholder="Nhập mật khẩu..." 
                   class="w-full pl-10 pr-10 py-3 rounded-xl border border-slate-200 focus:border-brand-600 focus:ring-2 focus:ring-red-100 text-sm outline-none transition">
            <button type="button" id="toggle-pw" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600">
              <i class="fa-solid fa-eye text-sm"></i>
            </button>
          </div>
        </div>

        <!-- Nút Đăng nhập -->
        <button type="submit" id="login-btn" class="w-full py-3.5 px-4 rounded-xl font-bold text-white bg-brand-600 hover:bg-brand-700 shadow-lg shadow-red-200 hover:shadow-xl transition-all flex items-center justify-center space-x-2 text-sm">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>Đăng Nhập Vào CMS</span>
        </button>
      </form>

    </div>

    <!-- Trở về trang chủ -->
    <div class="text-center mt-6">
      <a href="/" class="text-xs font-semibold text-slate-500 hover:text-brand-600 transition flex items-center justify-center space-x-1.5">
        <i class="fa-solid fa-arrow-left text-[11px]"></i>
        <span>Quay về Trang chủ Landing Page</span>
      </a>
    </div>

  </div>

  <div id="toast-container"></div>

  <script>
    // Kiểm tra nếu đã có token hợp lệ thì chuyển hướng luôn sang /admin (hoặc URL redirect được chỉ định)
    const token = localStorage.getItem('admin_token');
    const redirectUrl = new URLSearchParams(window.location.search).get('redirect') || '/admin';
    if (token) {
      fetch('/api/auth/me', {
        headers: { 'Authorization': `Bearer ${token}` }
      }).then(r => r.json()).then(res => {
        if (res.success) {
          window.location.href = redirectUrl;
        }
      }).catch(() => {});
    }

    // Toggle Password Visibility
    const togglePw = document.getElementById('toggle-pw');
    const pwInput = document.getElementById('password');
    if (togglePw && pwInput) {
      togglePw.addEventListener('click', () => {
        const type = pwInput.getAttribute('type') === 'password' ? 'text' : 'password';
        pwInput.setAttribute('type', type);
        togglePw.innerHTML = type === 'password' ? '<i class="fa-solid fa-eye text-sm"></i>' : '<i class="fa-solid fa-eye-slash text-sm"></i>';
      });
    }

    // Xử lý gửi form đăng nhập
    const form = document.getElementById('login-form');
    const alertBox = document.getElementById('login-alert');
    const alertText = document.getElementById('login-alert-text');
    const loginBtn = document.getElementById('login-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('hidden');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      loginBtn.disabled = true;
      loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Đang xác thực...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (data.success) {
          // Lưu token và thông tin user
          localStorage.setItem('admin_token', data.token);
          localStorage.setItem('admin_user', JSON.stringify(data.user));

          loginBtn.innerHTML = '<i class="fa-solid fa-circle-check mr-2"></i> Thành công! Đang chuyển hướng...';
          loginBtn.className = 'w-full py-3.5 px-4 rounded-xl font-bold text-white bg-green-600 transition-all flex items-center justify-center space-x-2 text-sm';
          
          setTimeout(() => {
            window.location.href = redirectUrl;
          }, 600);
        } else {
          alertBox.className = 'mb-5 p-3.5 rounded-xl text-xs font-semibold flex items-center space-x-2 bg-red-100 text-brand-700 border border-red-200';
          alertText.textContent = data.message || 'Tên đăng nhập hoặc mật khẩu không chính xác!';
          alertBox.classList.remove('hidden');

          loginBtn.disabled = false;
          loginBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i><span>Đăng Nhập Vào CMS</span>';
        }
      } catch (err) {
        alertBox.className = 'mb-5 p-3.5 rounded-xl text-xs font-semibold flex items-center space-x-2 bg-red-100 text-brand-700 border border-red-200';
        alertText.textContent = 'Lỗi kết nối máy chủ, vui lòng kiểm tra lại!';
        alertBox.classList.remove('hidden');

        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i><span>Đăng Nhập Vào CMS</span>';
      }
    });
  </script>
</body>
</html>
